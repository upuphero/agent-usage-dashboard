[workspace]
members = ["crates/usage-core", "crates/usage-contracts", "crates/usage-adapters", "apps/desktop/src-tauri"]
default-members = ["crates/usage-core", "crates/usage-contracts", "crates/usage-adapters"]
resolver = "2"

[workspace.package]
version = "0.0.4"
edition = "2021"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1.89"
futures-util = "0.3.31"
chrono = { version = "0.4.42", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["serde"] }
rust_decimal = { version = "1.39", features = ["serde-str"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
usage-core = { path = "crates/usage-core" }
usage-contracts = { path = "crates/usage-contracts" }
usage-adapters = { path = "crates/usage-adapters" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
