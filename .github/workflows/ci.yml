name: Validate
on:
  # Source publication first. Automatic validation/packaging will be enabled after pipeline verification.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts-core-dashboard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 verified 2026-10-04
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4, annotated tag peeled
        with:
          version: 9.15.0
      - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm scripts:test
      - run: node --test crates/usage-adapters/tests/*.test.mjs
      - run: pnpm contracts:check
      - run: pnpm boundaries:check
      - run: pnpm version:check
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: cargo fmt --all --check
      - run: cargo test -p usage-core -p usage-contracts -p usage-adapters --locked
      - run: cargo clippy -p usage-core -p usage-contracts -p usage-adapters --all-targets --locked -- -D warnings
  desktop-host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - run: rustup toolchain install 1.91.1 --profile minimal --component clippy
      - run: rustup target add ${{ matrix.target }} --toolchain 1.91.1
      - run: pnpm install --frozen-lockfile
      - run: node scripts/prepare-ccusage.mjs --target ${{ matrix.target }}
      - run: node scripts/verify-sidecar.mjs --target ${{ matrix.target }}
      - run: node scripts/ci-sidecar-env.mjs ${{ matrix.target }}
      # Deliberately no sidecar stub. Native host/IPC tests use the local no-bundle config.
      - run: pnpm desktop:build --target=${{ matrix.target }} --local
      - run: cargo test -p usage-desktop --locked --target ${{ matrix.target }}
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[]}}'
      - run: cargo test -p usage-adapters --test native_pipeline --locked --target ${{ matrix.target }} -- --ignored
      - run: cargo test -p usage-desktop --locked --target ${{ matrix.target }} -- --ignored
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[]}}'
      - run: cargo clippy -p usage-desktop --all-targets --locked --target ${{ matrix.target }} -- -D warnings
        env:
          TAURI_CONFIG: '{"bundle":{"active":false,"externalBin":[]}}'
