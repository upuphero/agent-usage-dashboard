name: Validate
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  contracts-dashboard:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm scripts:test
      - run: node --test crates/usage-adapters/tests/*.test.mjs
      - run: pnpm contracts:check && pnpm boundaries:check && pnpm version:check
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
  core-adapters:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo test -p usage-core -p usage-contracts -p usage-adapters --locked
      - run: cargo clippy -p usage-core -p usage-contracts -p usage-adapters --all-targets --locked -- -D warnings
