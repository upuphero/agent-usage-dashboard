name: Desktop packages
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore', '.gitattributes']
  pull_request:
    paths-ignore: ['**/*.md', 'LICENSE', '.gitignore', '.gitattributes']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: github.event.repository.private == false
    uses: ./.github/workflows/ci.yml
  package:
    needs: validate
    if: github.event.repository.private == false
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - name: Install pinned native Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --component clippy --target ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-version.mjs --tag=$RELEASE_TAG
        shell: bash
      - name: Build native Tauri installer with locked sidecar
        run: pnpm desktop:build --target=${{ matrix.target }}
      - run: node scripts/ci-sidecar-env.mjs ${{ matrix.target }}
      - name: Native unit and storage tests
        run: cargo test -p usage-core -p usage-contracts -p usage-adapters -p usage-desktop --release --features usage-desktop/custom-protocol --locked --target ${{ matrix.target }}
      - name: Native sidecar and host integration tests
        run: cargo test -p usage-adapters -p usage-desktop --release --features usage-desktop/custom-protocol --locked --target ${{ matrix.target }} -- --ignored
      - name: Install Windows NSIS and verify installed binaries
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows.ps1
      - name: Mount ARM64 DMG, copy app and verify installed binaries
        if: runner.os == 'macOS'
        run: bash scripts/smoke-macos.sh
      - name: Test the installed sidecar through native adapters and host
        run: cargo test -p usage-adapters -p usage-desktop --release --features usage-desktop/custom-protocol --locked --target ${{ matrix.target }} -- --ignored
      - name: Native host lint
        run: cargo clippy -p usage-desktop --release --features custom-protocol --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - name: Stage only the installer and build evidence
        run: node scripts/stage-package.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-${{ matrix.target }}
          path: artifacts/${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  collect:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: package-*
          path: artifacts
      - name: Require both verified targets and generate hashes
        run: node scripts/collect-release-artifacts.mjs artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-installers-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
